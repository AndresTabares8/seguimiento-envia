name: Seguimiento Envía
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seguimiento-envia
  cancel-in-progress: false

jobs:
  consultar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      listo: ${{ steps.lote.outputs.listo }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests
      - name: Consultar 20 guías
        id: lote
        env:
          GUIAS_JSON: ${{ secrets.GUIAS_JSON }}
        run: |
          python seguimiento_envia.py
          echo "listo=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: seguimiento-iphone
          path: site/
          retention-days: 2
      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLICAR_PAGES == 'true'
        with:
          path: site/
          retention-days: 1
      - name: Comprobar evidencia
        run: |
          python -c "import json,sys; sys.exit(1 if json.load(open('salud.json'))['sin_verificar'] else 0)"

  publicar:
    needs: consultar
    if: always() && needs.consultar.outputs.listo == 'true' && vars.PUBLICAR_PAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar resultados sin números de guía
        id: despliegue
        uses: actions/deploy-pages@v4
